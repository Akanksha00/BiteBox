		<h1>Customer Registration & Order Form</h1>
		<form>
			<h3>Customer Information</h3>
			<table>
				<tr>
					<td><label class="form-label" for="fullname" class="Required">Full Name:</label></td>
					<td><input  class="form-control" placeholder="Full Name" type="text" id="fullname" name="fullname" required></td>
				</tr>
				<tr>
					<td><label class="form-label"for="email" class="Required">Email:</label></td>
					<td><input class="form-control" placeholder="abc@xyz.com" type="email" id="email" name="email" required></td>
				</tr>
				<tr>
					<td><label class="form-label"for="password" class="Required">Password:</label></td>
					<td><input class="form-control" placeholder="Password" type="password" id="password" name="password" required></td>
				</tr>
				<tr>
					<td><label class="form-label"for="phone" class="Required">Phone Number:</label></td>
					<td><input class="form-control" placeholder="Phone Number" type="tel" id="phone" name="phone" required></td>
				</tr>
			</table>
			<h3>Order Information</h3>
			<table>
				<tr>
					<td><label class="form-label" for="Quantity" class="Required">Quantity:</label></td>
					<td><input class="form-control" placeholder="Quantity" type="number" id="Quantity" name="Quantity" min="1" max="10" required></td>
				</tr>
				<tr>
					<td><label class="form-label"for="DeliveryDate" class="Required">Delivery Date:</label></td>
					<td><input class="form-control" type="date" id="DeliveryDate" name="DeliveryDate" required></td>
				</tr>
				<tr>
					<td><label class="form-label" for="food" class="Required">SelectFood:</label></td>
					<td>
						<select class="form-control" id="food" name="food" required>
							<option value="">--Please choose an option--</option>
							<option value="pizza">Pizza</option>
							<option value="burger">Burger</option>
							<option value="pasta">Pasta</option>
                            <option value="deserts">Deserts</option>
                            <option value="beverages">Beverages</option>
						</select>
					</td>
				</tr>
			</table>
            <h3>Payment Method</h3>
            <table>
                <tr>
                    <td><label class="form-label" for="payment" class="Required">Select Payment Method:</label></td>
                    <td>
                        <!-- cc--Credit Card -->
                        <input class="form-check-input" type="radio" id="creditcard" name="payment" value="cc" required>
                        <label class="form-label" for="creditcard">Credit Card</label><br>
                        <!-- dc--Debit Card -->
                        <input class="form-check-input" type="radio" id="debitcard" name="payment" value="dc" required>
                        <label class="form-label" for="debitcard">Debit Card</label><br>
                        <!-- cash--Cash on Delivery -->
                        <input class="form-check-input" type="radio" id="cash" name="payment" value="cash" required>
                        <label class="form-label" for="cash">Cash on Delivery</label>
                    </td>
                    </tr>
            </table>
            <h3>Extras</h3>
            <table>
                <tr>
                    <td><label class="form-label" for="extras">Select Extras:</label></td>
                    <td>
                        <input class="form-check-input" type="checkbox" id="cheese" name="extras" value="cheese">
                        <label class="form-check-label" for="cheese">Extra Cheese</label><br>
                        <input class="form-check-input" type="checkbox" id="sauce" name="extras" value="sauce">
                        <label class="form-check-label" for="sauce">Extra Sauce</label><br>
                        <input class="form-check-input" type="checkbox" id="toppings" name="extras" value="toppings">
                        <label class="form-check-label" for="toppings">Extra Toppings</label><br>
                    </td>
                </tr>
            </table>
           <h3>Delivery Instructions</h3>
           <table>
                <tr>
                    <td><label class="form-label" for="delivery">Delivery Instructions:</label></td>
                    <td><textarea class="form-control" id="delivery" name="delivery" rows="4" cols="50"></textarea></td>
                </tr>
                <tr>
                    <td><input class="btn btn-primary" type="submit" value="Submit Form"></td>
                    <td><input class="btn btn-secondary" type="reset" value="Reset Form"></td>
                </tr>
            </table>

		</form>
